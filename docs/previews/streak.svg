<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 195" width="540" height="195" role="img" aria-label="torvalds's contribution streaks">
  <defs>
    <linearGradient id="fireGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb800" />
      <stop offset="55%" stop-color="#ff6b00" />
      <stop offset="100%" stop-color="#ff0055" />
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="539" height="194" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1" />

  <!-- Card Header -->
  <g class="header">
    <rect x="22" y="18" width="28" height="28" rx="8" fill="url(#fireGrad)" />
    <g transform="translate(28, 24) scale(0.6667)">
      <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z" fill="#ffffff" opacity="0.95" />
    </g>
    <text x="58" y="36" font-size="14" font-weight="700" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      torvalds&apos;s Contribution Stats
    </text>
  </g>

  <!-- 3 Stats Columns (shared geometry: badge cy=18, label y=46, value y=74, sub y=93) -->
  <!-- Column 1: Total Contributions -->
  <g transform="translate(20, 62)">
    <rect width="154" height="110" rx="8" fill="#30363d" opacity="0.25" />
    <circle cx="77" cy="18" r="12" fill="#8b949e" opacity="0.15" />
    <g transform="translate(68, 9)"><rect x="0" y="0" width="5" height="5" rx="1.2" fill="#8b949e" opacity="0.3" /><rect x="6.5" y="0" width="5" height="5" rx="1.2" fill="#8b949e" opacity="0.65" /><rect x="13" y="0" width="5" height="5" rx="1.2" fill="#8b949e" opacity="1" /><rect x="0" y="6.5" width="5" height="5" rx="1.2" fill="#8b949e" opacity="0.55" /><rect x="6.5" y="6.5" width="5" height="5" rx="1.2" fill="#8b949e" opacity="1" /><rect x="13" y="6.5" width="5" height="5" rx="1.2" fill="#8b949e" opacity="0.45" /><rect x="0" y="13" width="5" height="5" rx="1.2" fill="#8b949e" opacity="0.9" /><rect x="6.5" y="13" width="5" height="5" rx="1.2" fill="#8b949e" opacity="0.4" /><rect x="13" y="13" width="5" height="5" rx="1.2" fill="#8b949e" opacity="0.75" /></g>
    <text x="77" y="46" text-anchor="middle" font-size="11" font-weight="600" letter-spacing="0.4" fill="#6e7681" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">TOTAL CONTRIBUTIONS</text>
    <text x="77" y="74" text-anchor="middle" font-size="24" font-weight="800" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      3,703
    </text>
    <text x="77" y="93" text-anchor="middle" font-size="10" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      10.01 / day avg
    </text>
  </g>

  <!-- Column 2: Current Streak (Highlighted) -->
  <g transform="translate(193, 62)">
    <rect width="154" height="110" rx="8" fill="#30363d" opacity="0.45" stroke="#39d353" stroke-width="1.2" />
    <circle cx="77" cy="18" r="12" fill="#ff6b00" opacity="0.18" />
    <g transform="translate(67, 8) scale(0.8333)">
      <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z" fill="url(#fireGrad)" />
    </g>
    <text x="77" y="46" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="0.4" fill="#39d353" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">CURRENT STREAK</text>
    <text x="77" y="74" text-anchor="middle" font-size="26" font-weight="800" fill="#39d353" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      73 <tspan font-size="14" font-weight="600">days</tspan>
    </text>
    <text x="77" y="93" text-anchor="middle" font-size="10" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      Active now
    </text>
  </g>

  <!-- Column 3: Longest Streak -->
  <g transform="translate(366, 62)">
    <rect width="154" height="110" rx="8" fill="#30363d" opacity="0.25" />
    <circle cx="77" cy="18" r="12" fill="#f59e0b" opacity="0.15" />
    <g transform="translate(68, 9) scale(0.75)" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" />
      <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" />
      <path d="M4 22h16" />
      <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" />
      <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" />
      <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" />
    </g>
    <text x="77" y="46" text-anchor="middle" font-size="11" font-weight="600" letter-spacing="0.4" fill="#6e7681" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">LONGEST STREAK</text>
    <text x="77" y="74" text-anchor="middle" font-size="24" font-weight="800" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      80 <tspan font-size="14" font-weight="600">days</tspan>
    </text>
    <text x="77" y="93" text-anchor="middle" font-size="10" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      Personal best
    </text>
  </g>
</svg>